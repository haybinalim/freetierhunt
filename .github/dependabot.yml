version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Europe/Istanbul'
    open-pull-requests-limit: 5
    versioning-strategy: increase
    ignore:
      # Keep @types/node on the Node major used in CI/runtime (22); bump it by hand.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      dev-deps:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
      prod-minor-patch:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
    labels:
      - 'dependencies'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
      - 'ci'
