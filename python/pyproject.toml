[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freetierhunt-discovery-ingress"
version = "0.1.0"
description = "Reference skeleton for trusted discovery adapters and authorized Telegram ingress"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
  "psycopg[binary,pool]>=3.2,<4.0",
  "httpx>=0.27,<1.0",
  "defusedxml>=0.7,<1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0,<9.0",
  "pytest-mock>=3.14,<4.0",
]

[tool.pytest.ini_options]
testpaths = ["telegram_ingress/tests", "discovery_adapters/tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["telegram_ingress", "discovery_adapters"]
