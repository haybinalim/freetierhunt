[project]
name = "freetierhunt-telegram-ingress"
version = "0.1.0"
description = "Reference skeleton for authorized Telegram channel ingress"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0,<9.0",
  "httpx>=0.27,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["telegram_ingress/tests"]
pythonpath = ["."]
